name: 오즈백 수집·작성·발행

# 2시간마다 깨어나되, 실제로 쓰는 건 하루 2편이다(아침 8시·저녁 8시 슬롯).
# 편수를 줄인 만큼 글 한 편에 AI 예산을 더 쓴다.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: oddsbag-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 수집 실행
        working-directory: content-factory
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_WORKLOG_DB_ID: ${{ secrets.NOTION_WORKLOG_DB_ID }} # 노션 작업일지 (없으면 기록만 건너뜀)
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          COLLECT_LIMIT: "1" # 한 회차에 쓸 글 수 (슬롯당 1편)
          WRITE_DAILY_CAP: "1" # 하루 뉴스 작성 편수 — 요일 편성에서 뉴스는 화요일 1편뿐이다
          WRITE_SLOTS_KST: "8" # 아침 한 번만 — 하루 1편 편성
          QUEUE_MAX: "14" # 대기열 2주치 — 요일 코너가 결번 없이 돌려면 미리 쥐고 있어야 한다
          # (묵은 뉴스는 이제 NEWS_MAX_AGE_DAYS 가 막는다 — publish.mjs)
          PUBLISH_GAP_MIN: "1440" # 발행 간격 24시간 = 하루 1편
          PUBLISH_DAILY_CAP: "1" # 홈페이지 하루 1편 — 요일마다 코너가 하나다
          TIPS_PER_DAY: "2" # 꿀팁 하루 생산 상한 (새벽 슬롯 1 + 아침 슬롯 1)
          # 2026-08-08 실측: 카드뉴스 29개의 도달 합계가 0이었다(해시태그를 붙인 10개도 0).
          # 인스타 도달 1,337은 전부 릴스에서 나왔다. 그래서 카드뉴스는 2 → 1로 줄이고
          # 그 자리를 릴스에 넘긴다(reels.yml REEL_LIMIT 2). 인스타 하루 3개는 그대로.
          SOCIAL_DAILY_CAP: "1" # 인스타 카드뉴스 1개 (+릴스 2개 = 인스타 하루 3개)
          SOCIAL_GAP_MIN: "360" # 인스타 게시 최소 간격 6시간 (하루 2개가 실제로 나가려면 짧아야 한다)
        run: node run-collect.mjs
