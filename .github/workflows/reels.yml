name: 오즈백 릴스 자동 제작

# 매일 2회(10/22시 KST) 각 1개씩 = 하루 2개. 수동 실행도 가능.
# 발행된 글 3편을 각각 영상으로 만든다.
#
# 【하루 2개 정책】 채널별 상한은 make-reels.mjs 가 세어서 지킨다.
#  · 유튜브 쇼츠  2개 — 만든 영상 전부 (알고리즘 노출형이라 피드 도배 걱정이 없다)
#  · 인스타 릴스  1개 — 카드뉴스 1개와 합쳐 인스타 하루 2개
#  · 페북 영상    1개 — 링크 게시 1개와 합쳐 페북 하루 2개
on:
  schedule:
    - cron: "0 1,13 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "한 번에 만들 릴스 수"
        default: "1"
      yt_upload:
        description: "유튜브 자동 업로드 (0 = 끄고 업로드 양식만 만들기)"
        default: "1"

concurrency:
  group: oddsbag-reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 렌더링 라이브러리 설치
        working-directory: factory
        run: npm ci

      # 무엇이 실제로 사람에게 닿았는지 매일 재서 남긴다.
      # 이걸 안 봤기 때문에 카드뉴스가 29개 연속 도달 0인 걸 3주 동안 몰랐다.
      #
      # ★ 왜 업로드보다 '먼저' 재는가 (2026-08-08)
      #   유튜브 하루 한도는 10,000점인데 영상 1편 올리는 데 1,600점이 든다.
      #   게다가 오즈백 5개 채널(오피셜·뮤직·메모냅·키즈·테일즈)이 같은 구글 프로젝트를 쓴다
      #   = 한도 10,000점을 다섯이 나눠 쓴다. 다른 트랙이 먼저 올리면 우리 차례엔 남는 게 없다.
      #   성적표 읽기는 5점밖에 안 드는데, 뒤에 두면 그 5점이 없어서 못 잰다.
      #   실제로 2026-08-08 에 한도 소진으로 못 쟀다. 그래서 맨 앞으로 옮겼다.
      - name: 채널 성적표 (읽기 전용)
        working-directory: factory
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node channel-report.mjs || true

      - name: 릴스 제작 (+ 게시)
        working-directory: factory
        env:
          # DB 직접 읽기 (Vercel 불필요)
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ODDS_VOICE: ${{ secrets.ODDS_VOICE }}
          # 노션 작업일지 (없으면 기록만 건너뛴다 — 영상 제작·게시는 그대로)
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WORKLOG_DB_ID: ${{ secrets.NOTION_WORKLOG_DB_ID }}
          # 배경영상(B-roll) 켜기 — Pexels 무료·상업안전. 못 찾으면 자동 타이포 폴백
          USE_BROLL: "1"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # --- 게시용 (없으면 영상만 만들고 게시는 건너뜀) ---
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          MEDIA_PUBLIC_BASE: ${{ secrets.MEDIA_PUBLIC_BASE }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PUBLISHED: ${{ secrets.FB_PUBLISHED }}
          YT_DAILY_CAP: "2" # 유튜브 쇼츠 하루 2개
          # 유튜브 자동 업로드 스위치. 0 으로 돌리면 올리지 않고 '업로드 양식'만 만든다.
          # (손으로 올리면 API 한도를 0점 쓴다 — 오즈백뮤직 앨범 올리는 날 한도를 양보할 때 쓴다)
          YT_UPLOAD: ${{ github.event.inputs.yt_upload || '1' }}
          IG_REEL_DAILY_CAP: "2" # 인스타 릴스 하루 2개 — 카드뉴스에서 넘겨받은 자리 (카드뉴스 1개와 합쳐 하루 3개)
          FB_VIDEO_DAILY_CAP: "1" # 페북 영상 하루 1개 (링크 1개와 합쳐 2개)
          # 카드뉴스(도달 0)에서 빼 온 자리를 릴스가 받는다 — 2026-08-08 실측 근거.
          # 하루 2회 실행 × 1개였던 것을 회차당 1개로 두되 인스타 상한을 2로 올려
          # 하루 릴스 2개가 실제로 나가게 한다.
          REEL_LIMIT: ${{ github.event.inputs.limit || '1' }}
        run: node make-reels.mjs

      # 새 영상이 올라간 글의 옛 영상을 지워 교체한다(같은 글에 2개 이상일 때만, 최신 1개는 무조건 남김)
      - name: 옛 영상 교체
        if: always()
        working-directory: factory
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node replace-old.mjs --confirm

      # 놓친 영상이 없는지 매번 점검한다(읽기 전용). 글이 내려간 '고아 영상'은 교체로 안 지워지므로
      # 여기서 발견되면 로그에 남는다 → 사장님께 보고 후 손으로 삭제.
      - name: 남은 영상 점검 (읽기 전용)
        if: always()
        working-directory: factory
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node check-coverage.mjs || true

      - name: 완성 영상 보관 (다운로드용)
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: |
            factory/out/*.mp4
            factory/out/*.html
            factory/out/*.jpg
            factory/out/*.json
          if-no-files-found: ignore
          # 대표가 직접 올리는 분업으로 바뀌었다(2026-08-10). 며칠 못 올리셔도 영상이
          # 사라지지 않도록 7일 → 30일. 받아오는 쪽: 01_오피셜/유튜브대기/받아오기.mjs
          retention-days: 30
