name: 오즈백 예약 발행

# 15분마다 대기열을 확인해 시간이 된 글을 올린다. 실제 발행은 하루 3편까지
# (뉴스 1 + 가이드 2). Vercel 크론 대체 — 무료.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: oddsbag-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 발행 실행
        working-directory: content-factory
        env:
          TIPS_PER_DAY: "2" # 꿀팁 하루 생산 상한 (새벽 슬롯 1 + 아침 슬롯 1)
          PUBLISH_DAILY_CAP: "1" # 홈페이지 하루 1편 — 요일마다 코너가 하나다
          NEWS_MAX_AGE_DAYS: "4" # 대기 중 이만큼 지난 뉴스는 내보내지 않고 검수함으로 (가이드는 제외)
          PUBLISH_MAX_PER_RUN: "1" # 한 회차에 1편씩만
          # 2026-08-08 실측: 카드뉴스 29개의 도달 합계가 0이었다(해시태그를 붙인 10개도 0).
          # 인스타 도달 1,337은 전부 릴스에서 나왔다. 그래서 카드뉴스는 2 → 1로 줄이고
          # 그 자리를 릴스에 넘긴다(reels.yml REEL_LIMIT 2). 인스타 하루 3개는 그대로.
          SOCIAL_DAILY_CAP: "1" # 인스타 카드뉴스 1개 (+릴스 2개 = 인스타 하루 3개)
          SOCIAL_GAP_MIN: "360" # 인스타 게시 최소 간격 6시간 (하루 2개가 실제로 나가려면 짧아야 한다)
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_WORKLOG_DB_ID: ${{ secrets.NOTION_WORKLOG_DB_ID }} # 노션 작업일지 (없으면 기록만 건너뜀)
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node run-publish.mjs
