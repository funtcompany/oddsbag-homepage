name: 오즈백 가이드(꿀팁) 전용

# KST 새벽 3시에 하루 한 번. 뉴스 슬롯(아침 8시·저녁 8시)과 절대 겹치지 않는다.
#
# 왜 따로 도나
#   · 뉴스는 오늘 안 나가면 죽지만, 가이드는 다음 주에 나가도 값이 같다.
#   · 인스타가 가이드 전용 채널이 됐다(사장님 지시 2026-08-05). 올릴 가이드가 꾸준히 있어야 한다.
#   · 새벽은 AI 무료 한도가 막 초기화된 직후라 가장 여유롭다. 뉴스 작성과 한도를 놓고 다투지 않는다.
on:
  schedule:
    - cron: "0 18 * * *" # UTC 18시 = KST 새벽 3시
  # 손으로 돌릴 때는 상한을 올려 예약 분량을 미리 채울 수 있다.
  # (자동 회차는 아래 기본값 그대로 — 도배 방지 장치를 건드리지 않는다)
  workflow_dispatch:
    inputs:
      # ※ 입력 이름은 반드시 영문이어야 한다. GitHub 수식(${{ }})이 한글 이름을 못 읽어
      #   워크플로 전체가 해석 실패로 죽는다. 설명만 한글로 둔다.
      limit:
        description: "이번 회차에 만들 가이드 편수"
        required: false
        default: "1"
      daily_cap:
        description: "가이드 하루 상한 (기본 2). 미리 채울 때만 올린다"
        required: false
        default: "2"
      queue_max:
        description: "예약 대기열 상한 (기본 4)"
        required: false
        default: "4"

concurrency:
  group: oddsbag-guide
  cancel-in-progress: false

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 가이드 작성
        working-directory: content-factory
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_WORKLOG_DB_ID: ${{ secrets.NOTION_WORKLOG_DB_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          GUIDE_ONLY: "1" # 뉴스 수집을 아예 하지 않는다
          GUIDE_LIMIT: ${{ github.event.inputs.limit || '1' }} # 이 회차에 만들 가이드 편수
          TIPS_PER_DAY: ${{ github.event.inputs.daily_cap || '2' }} # 가이드 하루 상한 (새벽 1편 + 아침 슬롯 1편)
          QUEUE_MAX: ${{ github.event.inputs.queue_max || '4' }} # 발행 대기열 상한
          PUBLISH_GAP_MIN: "480" # 발행 간격 8시간 → 하루 3편이 고르게 퍼진다
          SOCIAL_DAILY_CAP: "1" # 인스타 카드뉴스 1개 (+릴스 2개 = 인스타 하루 3개) · 2026-08-08 결정
          SOCIAL_GAP_MIN: "360" # 인스타 게시 최소 간격 6시간
        run: node run-guide.mjs
